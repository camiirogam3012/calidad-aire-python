title: "Calidad del aire en Colombia"
author: Camilo Romero
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: force
  timeout: 600

repository:
  url: https://github.com/camiirogam3012/eda-calidad-aire-python
  branch: main

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true

sphinx:
  config:
    language: es
    html_show_copyright: false
    html_theme_options:
      show_toc_level: 2

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
